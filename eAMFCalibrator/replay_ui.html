<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v21 Replay</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.05);
  --v21: #2a78d6;
  --prod: #eb6834;
  --up: #006300;
  --down: #b42f2f;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --ring: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.06);
    --v21: #3987e5;
    --prod: #d95926;
    --up: #0ca30c;
    --down: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --ring: rgba(255, 255, 255, 0.10);
  --wash: rgba(255, 255, 255, 0.06);
  --v21: #3987e5;
  --prod: #d95926;
  --up: #0ca30c;
  --down: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.num { font-variant-numeric: tabular-nums; }
header {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  padding: 8px 16px; border-bottom: 1px solid var(--ring); background: var(--surface);
}
header h1 { font-size: 15px; margin: 0 8px 0 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 1px 8px; border-radius: 999px; background: var(--wash); color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.chip.off { color: var(--muted); }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--ring); }
.bar label { color: var(--muted); font-size: 12px; }
.bar .sep { width: 1px; height: 20px; background: var(--ring); margin: 0 4px; }
input, select, button {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--ring); border-radius: 6px; padding: 4px 8px;
}
button { cursor: pointer; }
button:hover { background: var(--wash); }
button.primary { border-color: var(--v21); }
button:disabled { opacity: 0.5; cursor: default; }
select#match { min-width: 300px; max-width: 100%; }
#status { color: var(--muted); font-size: 12px; margin-left: auto; }
#status.err { color: var(--down); }
main { display: grid; grid-template-columns: 410px minmax(0, 1fr) 290px; gap: 12px; padding: 12px 16px; align-items: start; }
@media (max-width: 1150px) { main { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 10px 12px; }
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.card-head h2 { font-size: 11px; font-weight: 600; color: var(--ink-2); margin: 0; text-transform: uppercase; letter-spacing: 0.05em; }
.card-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.stack > * + * { margin-top: 12px; }
.badge { font-size: 11px; color: var(--muted); border: 1px solid var(--ring); border-radius: 4px; padding: 0 5px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--ring); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 11px; }
th:first-child, td:first-child { text-align: left; }
td.diff.pos { color: var(--up); }
td.diff.neg { color: var(--down); }
td .odds { color: var(--muted); font-size: 11px; margin-left: 4px; }
td .susp { color: var(--muted); font-size: 10px; margin-left: 4px; text-transform: uppercase; }
td.na { color: var(--muted); }
.key { display: inline-block; width: 12px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
.key.v21 { border-color: var(--v21); }
.key.prod { border-color: var(--prod); }

/* play-by-play */
#tlCard { padding: 0; overflow: hidden; }
#tlCard .card-head { padding: 10px 12px 0; }
#tl { max-height: calc(100vh - 150px); overflow: auto; }
#tl table { font-size: 12px; }
#tl th, #tl td { padding: 4px 5px; }
#tl th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
#tl th:first-child, #tl td:first-child { padding-left: 12px; }
#tl th:last-child, #tl td:last-child { padding-right: 12px; }
#tl tbody tr { cursor: pointer; }
#tl tbody tr:hover { background: var(--wash); }
#tl tbody tr.current { background: var(--wash); box-shadow: inset 3px 0 0 var(--v21); }
#tl tbody tr.unpriced td.play, #tl tbody tr.unpriced td.dn { color: var(--muted); }
#tl td.play, #tl td.dn { text-align: left; color: var(--ink-2); }
#tl td.sc { font-weight: 600; text-align: center; }
#tl th.sc, #tl th.play, #tl th.dn { text-align: left; }
#tl th.sc { text-align: center; }

/* scoreboard */
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.scoreboard .who { font-weight: 600; font-size: 15px; }
.scoreboard .team { color: var(--muted); font-size: 12px; }
.scoreboard .away { text-align: right; }
.scoreboard .ball::after { content: " ●"; color: var(--ink-2); font-size: 10px; vertical-align: middle; }
.scoreboard .pts { text-align: center; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.scoreboard .clock { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); }
#situation { margin-top: 8px; }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--ring); }
.controls label { color: var(--ink-2); font-size: 12px; display: flex; gap: 4px; align-items: center; }

/* prices */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.stat .k { font-size: 11px; color: var(--muted); }
.stat .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dists { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .dists { grid-template-columns: 1fr; } }
.sub-h { font-size: 11px; color: var(--muted); }
svg text { fill: var(--muted); font-size: 10px; font-family: inherit; }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--ink-2); }

/* nudge */
.nudge-grid { display: grid; grid-template-columns: 70px 1fr; gap: 6px 8px; align-items: center; }
.nudge-grid label { color: var(--ink-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nudge-grid input[type="number"] { width: 90px; }
.share { display: flex; gap: 8px; align-items: center; }
.share input { flex: 1; min-width: 0; }
.btns { display: flex; gap: 6px; margin-top: 10px; }
#nudgeTable { margin-top: 10px; }
#nudgeTable td:first-child { color: var(--muted); }

/* chart */
#chartWrap { position: relative; }
#tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; display: none; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); z-index: 5;
}
#tip .v { font-weight: 600; color: var(--ink); }
#tip .l { color: var(--ink-2); }
.full { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>v21 Replay</h1>
  <div class="chips" id="metaChips"></div>
</header>

<div class="bar">
  <label for="day">Date</label>
  <input type="date" id="day">
  <label for="match">Match</label>
  <select id="match"><option value="">–</option></select>
  <label for="code">Code</label>
  <input id="code" size="12">
  <button id="loadMatch" class="primary">Load</button>
  <span class="sep"></span>
  <label for="paths">Sims</label>
  <input type="number" id="paths" min="200" max="20000" step="200" style="width: 80px">
  <span id="status" role="status"></span>
</div>

<main>
  <section class="card" id="tlCard" aria-label="Play-by-play">
    <div class="card-head"><h2>Play-by-play</h2><span class="right badge num" id="tlCount"></span></div>
    <div id="tl">
      <table>
        <thead><tr><th>Time</th><th class="sc">Score</th><th class="play">Play</th><th class="dn">Next</th><th><span class="key prod"></span>Prod</th><th><span class="key v21"></span>v21</th></tr></thead>
        <tbody id="timeline"></tbody>
      </table>
    </div>
  </section>

  <section class="stack">
    <div class="card">
      <div class="sub-h num" id="matchLine"></div>
      <div class="scoreboard">
        <div class="home"><div class="who" id="homeWho">Home</div><div class="team" id="homeTeam"></div></div>
        <div class="pts"><span id="score">–</span><span class="clock" id="clock"></span></div>
        <div class="away"><div class="who" id="awayWho">Away</div><div class="team" id="awayTeam"></div></div>
      </div>
      <div class="chips" id="situation"></div>
      <div class="controls">
        <button id="first" title="Kick-off (Home)">⏮</button>
        <button id="prev" title="Back (←)">◀</button>
        <button id="next" title="Next (→)">▶</button>
        <button id="last" title="End (End)">⏭</button>
        <button id="play" title="Play / pause (space)">Play</button>
        <select id="speed" aria-label="Speed">
          <option value="3000">0.5×</option>
          <option value="1200" selected>1×</option>
          <option value="400">3×</option>
        </select>
        <label><input type="checkbox" id="pricedOnly" checked> Skip unpriced</label>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Prices</h2><span class="right" id="priceBadge"></span></div>
      <table aria-label="v21 and prod prices">
        <thead><tr><th>Market</th><th>Line</th><th><span class="key v21"></span>v21</th><th><span class="key prod"></span>Prod</th><th>Diff</th></tr></thead>
        <tbody id="markets"></tbody>
      </table>
      <div class="stats" id="expected"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Distribution</h2>
        <div class="right legend"><span><span class="key v21"></span>v21</span><span><span class="key prod"></span>Prod line</span></div>
      </div>
      <div class="dists">
        <div><div class="sub-h">Margin</div><svg id="marginDist" width="100%" height="130"></svg></div>
        <div><div class="sub-h">Total</div><svg id="totalDist" width="100%" height="130"></svg></div>
      </div>
    </div>
  </section>

  <section class="stack">
    <div class="card">
      <div class="card-head"><h2>Nudge</h2><span class="right badge" id="nudgeBadge"></span></div>
      <div class="nudge-grid">
        <label for="meanHome" id="meanHomeLabel">Home</label><input type="number" step="0.1" id="meanHome" class="num">
        <label for="meanAway" id="meanAwayLabel">Away</label><input type="number" step="0.1" id="meanAway" class="num">
        <label for="share">Share</label><div class="share"><input type="range" id="share" min="0" max="1" step="0.05"><span id="shareText" class="num"></span></div>
      </div>
      <div class="btns">
        <button id="applyNudge" class="primary">Apply</button>
        <button id="resetNudge">Reset</button>
      </div>
      <table id="nudgeTable"><thead id="nudgeHead"></thead><tbody id="nudgeRows"></tbody></table>
    </div>
    <div class="card">
      <div class="card-head"><h2>Pre-match</h2></div>
      <table><thead><tr><th>Market</th><th>Line</th><th><span class="key v21"></span>v21</th><th><span class="key prod"></span>Prod</th></tr></thead><tbody id="prematch"></tbody></table>
    </div>
  </section>

  <section class="card full">
    <div class="card-head"><h2>Home win %</h2>
      <div class="right"><span class="legend"><span><span class="key v21"></span>v21</span><span><span class="key prod"></span>Prod</span></span>
        <button id="priceAll">Price all</button></div>
    </div>
    <div id="chartWrap"><svg id="chart" width="100%" height="240"></svg><div id="tip"></div></div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const S = {
  meta: null, match: null, steps: [], pos: 0, prices: new Map(), chartV21: new Map(),
  means: null, share: 0.75, paths: 1000, playing: null, nudgeKey: "",
};

async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function setStatus(t, err) { const s = $("status"); s.textContent = t || ""; s.classList.toggle("err", !!err); }
function pct(p) { return p == null ? "–" : (100 * p).toFixed(1) + "%"; }
function pct1(p) { return p == null ? "" : (100 * p).toFixed(1); }
function fair(p) { return p == null || p <= 0 ? "" : (1 / p).toFixed(2); }
function signed(x, k) { return (x > 0 ? "+" : "") + x.toFixed(k); }
function el(tag, attrs, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
function svgEl(tag, attrs) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  return e;
}
function ordinal(n) { return ({ 1: "1st", 2: "2nd", 3: "3rd" })[n] || (n + "th"); }
function spot(y) { return y == null ? "" : y < 50 ? "own " + y : y === 50 ? "50" : "opp " + (100 - y); }
function sideName(side) { return !S.match ? "" : side === "home" ? S.match.home : side === "away" ? S.match.away : ""; }
function togo(t) { return t.field != null && t.distance != null && t.field + t.distance >= 100 ? "G" : t.distance; }
function downShort(t) { return t.offense && t.down ? `${t.down}&${togo(t)} ${spot(t.field)}` : ""; }
function playName(p) { const s = (p || "").toLowerCase().replace(/_/g, " "); return s.charAt(0).toUpperCase() + s.slice(1); }
function period(t) { return t.period > 4 ? "OT" + (t.period - 4) : "Q" + t.period; }
function betState(s) { s = (s || "").toUpperCase(); return !s ? "" : s.includes("UNSUSPEND") ? "Open" : s.includes("SUSPEND") ? "Suspended" : s.toLowerCase(); }
function gameSeconds(t) {
  if (!t || !t.period) return 0;
  const [m, s] = (t.clock || "4:00").split(":").map(Number);
  return (t.period - 1) * 240 + (240 - (m * 60 + s));
}
function shortPath(p) {
  if (!p) return "";
  const parts = p.split(/[\\/]/).filter(Boolean);
  const last = parts[parts.length - 1] || p;
  return /^v21model\.pkl$/i.test(last) && parts.length > 1 ? parts[parts.length - 2] : last;
}

// ---------------------------------------------------------------- meta and the match list

async function init() {
  const m = await api("/api/meta");
  S.meta = m; S.paths = m.paths; S.share = m.share;
  const chips = $("metaChips");
  chips.textContent = "";
  const chip = (text, title, off) => chips.append(el("span", { class: "chip" + (off ? " off" : ""), title: title || "" }, text));
  chip(shortPath(m.model) + (m.mode ? ` · ${m.mode}` : ""), m.model);
  chip(m.prior ? `Prior ${shortPath(m.prior)}` : "No prior", m.prior || "", !m.prior);
  chip(m.source_kind || "Snowflake", m.source);
  $("paths").value = m.paths;
  $("share").value = m.share; $("shareText").textContent = Math.round(100 * m.share) + "%";
  $("nudgeBadge").textContent = m.nudge ? "" : "Off";
  $("nudgeBadge").style.display = m.nudge ? "none" : "";
  if (m.last_day) { $("day").value = m.last_day; loadDay(); }
}

async function loadDay() {
  const day = $("day").value;
  if (!day) return;
  setStatus("Loading matches…");
  try {
    const { matches } = await api("/api/matches", { day });
    const sel = $("match");
    sel.textContent = "";
    sel.append(el("option", { value: "" }, matches.length ? `${matches.length} matches` : "No matches"));
    for (const x of matches) {
      const fin = x.final && x.final[0] != null ? `   ${x.final[0]}–${x.final[1]}` : "";
      const who = x.home ? `${x.home} (${x.home_team}) v ${x.away} (${x.away_team})` : x.code;
      sel.append(el("option", { value: x.code }, `${x.start}  ${who}${fin}`));
    }
    setStatus("");
  } catch (e) { setStatus(e.message, true); }
}

async function loadMatch() {
  const code = $("code").value.trim() || $("match").value;
  if (!code) return;
  stopPlay();
  setStatus(`Loading ${code}…`);
  try {
    const m = await api("/api/load", { code });
    S.match = m; S.prices.clear(); S.chartV21.clear();
    S.steps = [{ kick: true, message: null }].concat(m.timeline);
    S.means = m.prior ? m.prior.slice() : null;
    $("homeWho").textContent = m.home; $("homeTeam").textContent = m.home_team;
    $("awayWho").textContent = m.away; $("awayTeam").textContent = m.away_team;
    $("meanHomeLabel").textContent = m.home; $("meanAwayLabel").textContent = m.away;
    $("meanHome").value = S.means ? S.means[0] : ""; $("meanAway").value = S.means ? S.means[1] : "";
    $("tlCount").textContent = `${m.n_priced}/${m.timeline.length}`;
    $("tlCount").title = "priced / plays";
    renderTimeline();
    $("matchLine").textContent = [m.code, m.start, `FT ${m.final[0]}–${m.final[1]}`].join(" · ");
    setStatus("");
    await go(0);
    renderPrematch();
  } catch (e) { setStatus(e.message, true); }
}

// ---------------------------------------------------------------- the play-by-play

function renderTimeline() {
  const body = $("timeline");
  body.textContent = "";
  S.steps.forEach((t, i) => {
    const tr = el("tr", { class: t.kick || t.priced ? "" : "unpriced", "data-i": i });
    if (t.kick) {
      tr.append(el("td", { class: "num" }, "KO"), el("td", { class: "sc num" }, "0–0"),
                el("td", { class: "play" }, "Pre-match"), el("td", { class: "dn" }, ""));
    } else {
      tr.append(el("td", { class: "num" }, `${period(t)} ${t.clock}`), el("td", { class: "sc num" }, `${t.home}–${t.away}`),
                el("td", { class: "play" }, playName(t.play)), el("td", { class: "dn num" }, downShort(t)));
    }
    tr.append(el("td", { class: "pr num" }), el("td", { class: "vv num" }));
    tr.addEventListener("click", () => { stopPlay(); go(i); });
    body.append(tr);
  });
  refreshTimelineProbs();
}

function prodHome(i) {
  const t = S.steps[i];
  if (!t) return null;
  const q = t.kick ? (S.match.prematch || {})["50"] : (t.prod || {})["50"];
  return q ? q.p : null;
}
function v21Home(i) {
  const t = S.steps[i];
  const key = t.kick ? "kick" : t.message;
  const pr = S.prices.get(priceKey(key));
  if (pr && pr.priced) return pr.moneyline.home;
  return S.chartV21.has(key) ? S.chartV21.get(key) : null;
}
function refreshTimelineProbs() {
  $("timeline").querySelectorAll("tr").forEach((tr, i) => {
    tr.querySelector(".pr").textContent = pct1(prodHome(i));
    tr.querySelector(".vv").textContent = pct1(v21Home(i));
  });
}
function markCurrent() {
  const rows = $("timeline").querySelectorAll("tr");
  rows.forEach((tr, i) => tr.classList.toggle("current", i === S.pos));
  if (rows[S.pos]) rows[S.pos].scrollIntoView({ block: "nearest" });
}

// ---------------------------------------------------------------- stepping and pricing

function nudgeBody() { return { means: S.means, share: S.share, paths: S.paths }; }
function priceKey(key) { return `${key}|${S.nudgeKey}`; }
function currentNudgeKey() { return JSON.stringify([S.means, S.share, S.paths]); }

async function go(i) {
  if (!S.match) return;
  S.pos = Math.max(0, Math.min(S.steps.length - 1, i));
  markCurrent();
  renderBoard();
  const t = S.steps[S.pos];
  const key = t.kick ? "kick" : t.message;
  S.nudgeKey = currentNudgeKey();
  let pr = S.prices.get(priceKey(key));
  if (!pr) {
    if (!t.kick && !t.priced) {
      pr = { priced: false, prod: t.prod };
    } else {
      setStatus("Pricing…");
      try {
        pr = await api("/api/price", Object.assign({ code: S.match.code, message: t.kick ? null : t.message }, nudgeBody()));
        S.prices.set(priceKey(key), pr);
        setStatus("");
      } catch (e) { setStatus(e.message, true); return; }
    }
  }
  renderPrice(pr);
  if (pr.nudge) renderNudge(pr.nudge);
  if (t.kick) renderPrematch(pr);
  refreshTimelineProbs();
  drawChart();
}

function renderBoard() {
  const t = S.steps[S.pos];
  const sit = $("situation");
  sit.textContent = "";
  const chip = (text) => { if (text) sit.append(el("span", { class: "chip" }, text)); };
  $("homeWho").classList.toggle("ball", !t.kick && t.offense === "home");
  $("awayWho").classList.toggle("ball", !t.kick && t.offense === "away");
  if (t.kick) {
    $("score").textContent = "0–0"; $("clock").textContent = "Pre-match";
    return;
  }
  $("score").textContent = `${t.home}–${t.away}`;
  $("clock").textContent = `${period(t)} ${t.clock}`;
  chip(playName(t.play));
  if (t.offense && t.down) chip(`${ordinal(t.down)} & ${togo(t) === "G" ? "goal" : togo(t)}`);
  if (t.offense && t.field != null) chip(spot(t.field));
  chip(t.messages);
  chip(betState(t.bet_state));
  chip(`#${t.message}`);
}

function row(tbody, name, line, v, p, susp) {
  const tr = el("tr");
  tr.append(el("td", {}, name), el("td", {}, line == null ? "" : String(line)));
  const tdv = el("td", v == null ? { class: "na" } : {}); tdv.textContent = pct(v);
  if (v != null) tdv.append(el("span", { class: "odds" }, fair(v)));
  const tdp = el("td", p == null ? { class: "na" } : {}); tdp.textContent = pct(p);
  if (p != null) tdp.append(el("span", { class: "odds" }, fair(p)));
  if (p != null && susp) tdp.append(el("span", { class: "susp" }, "susp"));
  const d = v != null && p != null ? 100 * (v - p) : null;
  tr.append(tdv, tdp, el("td", { class: "diff" + (d == null ? "" : d > 0.05 ? " pos" : d < -0.05 ? " neg" : "") },
                          d == null ? "" : signed(d, 1)));
  tbody.append(tr);
}

function renderPrice(pr) {
  const tb = $("markets");
  tb.textContent = "";
  const prod = pr.prod || {};
  const susp = (q) => !!(q && q.live === false);
  const badge = $("priceBadge");
  badge.textContent = "";
  const home = S.match.home, away = S.match.away;
  const exp = $("expected");
  exp.textContent = "";
  if (!pr.priced) {
    badge.append(el("span", { class: "badge" }, "No v21 state"));
    if (prod["50"]) row(tb, `${home} ML`, null, null, prod["50"].p, susp(prod["50"]));
    if (prod["52"]) row(tb, `${home} spread`, prod["52"].line, null, prod["52"].p, susp(prod["52"]));
    if (prod["54"]) row(tb, "Over", prod["54"].line, null, prod["54"].p, susp(prod["54"]));
    drawDist($("marginDist"), null); drawDist($("totalDist"), null);
    return;
  }
  if (!Object.keys(prod).length) badge.append(el("span", { class: "badge" }, "No prod quote"));
  const at = pr.at_prod || {};
  row(tb, `${home} ML`, null, pr.moneyline.home, prod["50"] ? prod["50"].p : null, susp(prod["50"]));
  row(tb, `${away} ML`, null, pr.moneyline.away, prod["50"] ? 1 - prod["50"].p : null, susp(prod["50"]));
  const prodSpread = prod["52"] && prod["52"].line != null;
  if (prodSpread) row(tb, `${home} spread`, prod["52"].line, at["52"], prod["52"].p, susp(prod["52"]));
  if (!prodSpread || pr.spread.line !== prod["52"].line) row(tb, `${home} spread`, pr.spread.line, pr.spread.home, null);
  const prodTotal = prod["54"] && prod["54"].line != null;
  if (prodTotal) row(tb, "Over", prod["54"].line, at["54"], prod["54"].p, susp(prod["54"]));
  if (!prodTotal || pr.total.line !== prod["54"].line) row(tb, "Over", pr.total.line, pr.total.over, null);
  const e = pr.expected;
  const stat = (k, v) => { const d = el("div", { class: "stat" }); d.append(el("div", { class: "k" }, k), el("div", { class: "v" }, v)); exp.append(d); };
  stat(`${home} exp`, e.home.toFixed(2));
  stat(`${away} exp`, e.away.toFixed(2));
  stat("Margin", signed(e.margin, 2));
  stat("Total", e.total.toFixed(2));
  drawDist($("marginDist"), pr.margin_dist, prod["52"] ? prod["52"].line : null);
  drawDist($("totalDist"), pr.total_dist, prod["54"] ? prod["54"].line : null);
}

function renderPrematch(pr) {
  const tb = $("prematch");
  tb.textContent = "";
  if (!S.match) return;
  const pm = S.match.prematch || {};
  const kick = pr || S.prices.get(priceKey("kick"));
  const at = (kick && kick.at_prod) || {};
  const add = (name, line, v, p) => {
    const tr = el("tr");
    tr.append(el("td", {}, name), el("td", {}, line == null ? "" : String(line)),
              el("td", v == null ? { class: "na" } : {}, pct(v)), el("td", p == null ? { class: "na" } : {}, pct(p)));
    tb.append(tr);
  };
  add(`${S.match.home} ML`, null, kick && kick.priced ? kick.moneyline.home : null, pm["50"] ? pm["50"].p : null);
  if (pm["52"]) add(`${S.match.home} spread`, pm["52"].line, at["52"], pm["52"].p);
  if (pm["54"]) add("Over", pm["54"].line, at["54"], pm["54"].p);
}

function renderNudge(n) {
  const head = $("nudgeHead"), body = $("nudgeRows");
  head.textContent = ""; body.textContent = "";
  const hr = el("tr");
  hr.append(el("th", {}, ""), el("th", {}, S.match.home), el("th", {}, S.match.away));
  head.append(hr);
  const line = (label, xs, k) => {
    const tr = el("tr");
    tr.append(el("td", {}, label));
    (xs || [null, null]).forEach((x) => tr.append(el("td", x == null ? { class: "na" } : {}, x == null ? "–" : Number(x).toFixed(k))));
    body.append(tr);
  };
  line("Prior", S.match.prior, 2);
  line("Target", n.target, 2);
  line("Own", n.own, 2);
  line("Nudged", n.nudged, 2);
  line("Alpha", n.alpha, 3);
  const b = $("nudgeBadge"), note = S.match.prior_note;
  b.textContent = !n.available ? "Off" : note ? (note.startsWith("Prior failed") ? "Prior failed" : note) : "";
  b.title = n.available && note ? note : "";
  b.style.display = b.textContent ? "" : "none";
}

// ---------------------------------------------------------------- the distributions

function drawDist(svg, dist, line) {
  svg.textContent = "";
  if (!dist) return;
  const W = svg.clientWidth || 360, H = 130, pad = { l: 4, r: 4, t: 12, b: 18 };
  const n = dist.p.length, max = Math.max(...dist.p, 1e-9);
  const step = (W - pad.l - pad.r) / n, bw = Math.max(1, step - 2);
  const y = (p) => pad.t + (H - pad.t - pad.b) * (1 - p / max);
  svg.append(svgEl("line", { x1: pad.l, x2: W - pad.r, y1: H - pad.b, y2: H - pad.b, stroke: "var(--axis)" }));
  dist.p.forEach((p, k) => {
    const x = pad.l + k * step + (step - bw) / 2, top = y(p);
    const r = svgEl("rect", { x, y: top, width: bw, height: Math.max(0, H - pad.b - top), rx: Math.min(2, bw / 2), fill: "var(--v21)" });
    const title = svgEl("title"); title.textContent = `${dist.start + k}: ${pct(p)}`;
    r.append(title);
    svg.append(r);
  });
  const tickEvery = n > 60 ? 10 : 5;
  for (let k = 0; k < n; k++) {
    const v = dist.start + k;
    if (v % tickEvery) continue;
    const t = svgEl("text", { x: pad.l + k * step + step / 2, y: H - 4, "text-anchor": "middle" });
    t.textContent = String(v);
    svg.append(t);
  }
  if (line != null) {
    const x = pad.l + (line - dist.start + 0.5) * step;
    if (x > pad.l && x < W - pad.r) {
      svg.append(svgEl("line", { x1: x, x2: x, y1: pad.t, y2: H - pad.b, stroke: "var(--prod)", "stroke-width": 2 }));
      const t = svgEl("text", { x: x + 3, y: pad.t - 2 }); t.textContent = String(line); svg.append(t);
    }
  }
}

// ---------------------------------------------------------------- the chart

function drawChart() {
  const svg = $("chart");
  svg.textContent = "";
  if (!S.match) return;
  const W = svg.clientWidth || 900, H = 240, pad = { l: 40, r: 44, t: 10, b: 24 };
  const pts = S.steps.map((t, i) => ({ i, x: t.kick ? 0 : gameSeconds(t), prod: prodHome(i), v21: v21Home(i) }));
  const maxX = Math.max(960, ...pts.map((p) => p.x));
  const X = (x) => pad.l + (W - pad.l - pad.r) * x / maxX;
  const Y = (p) => pad.t + (H - pad.t - pad.b) * (1 - p);
  for (const g of [0, 0.25, 0.5, 0.75, 1]) {
    svg.append(svgEl("line", { x1: pad.l, x2: W - pad.r, y1: Y(g), y2: Y(g), stroke: g === 0.5 ? "var(--axis)" : "var(--grid)" }));
    const t = svgEl("text", { x: pad.l - 6, y: Y(g) + 4, "text-anchor": "end" }); t.textContent = Math.round(100 * g) + "%"; svg.append(t);
  }
  for (let q = 1; q * 240 <= maxX; q++) {
    svg.append(svgEl("line", { x1: X(q * 240), x2: X(q * 240), y1: pad.t, y2: H - pad.b, stroke: "var(--grid)" }));
  }
  for (let q = 0; q * 240 < maxX; q++) {
    const t = svgEl("text", { x: X(q * 240 + 120), y: H - 6, "text-anchor": "middle" }); t.textContent = q < 4 ? `Q${q + 1}` : `OT${q - 3}`; svg.append(t);
  }
  const path = (key, color) => {
    const ok = pts.filter((p) => p[key] != null);
    if (!ok.length) return null;
    const d = ok.map((p, k) => `${k ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p[key]).toFixed(1)}`).join("");
    svg.append(svgEl("path", { d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }));
    return ok[ok.length - 1];
  };
  const endProd = path("prod", "var(--prod)");
  const endV21 = path("v21", "var(--v21)");
  const labels = [];
  if (endProd) labels.push({ y: Y(endProd.prod), text: "Prod" });
  if (endV21) labels.push({ y: Y(endV21.v21), text: "v21" });
  if (labels.length === 2 && Math.abs(labels[0].y - labels[1].y) < 12) labels[1].y = labels[0].y + (labels[1].y >= labels[0].y ? 12 : -12);
  labels.forEach((l) => { const t = svgEl("text", { x: W - pad.r + 6, y: l.y + 4 }); t.textContent = l.text; svg.append(t); });
  const cur = pts[S.pos];
  if (cur) svg.append(svgEl("line", { x1: X(cur.x), x2: X(cur.x), y1: pad.t, y2: H - pad.b, stroke: "var(--ink-2)", "stroke-dasharray": "3 3" }));
  const hair = svgEl("line", { x1: 0, x2: 0, y1: pad.t, y2: H - pad.b, stroke: "var(--muted)", visibility: "hidden" });
  svg.append(hair);
  const hit = svgEl("rect", { x: pad.l, y: pad.t, width: W - pad.l - pad.r, height: H - pad.t - pad.b, fill: "transparent" });
  svg.append(hit);
  const tip = $("tip");
  const nearest = (evt) => {
    const box = svg.getBoundingClientRect();
    const mx = (evt.clientX - box.left) * ((svg.clientWidth || W) / box.width);
    const x = (mx - pad.l) / (W - pad.l - pad.r) * maxX;
    let best = 0, bd = Infinity;
    pts.forEach((p, k) => { const dd = Math.abs(p.x - x); if (dd < bd) { bd = dd; best = k; } });
    return best;
  };
  hit.addEventListener("pointermove", (evt) => {
    const k = nearest(evt), p = pts[k], t = S.steps[k];
    hair.setAttribute("x1", X(p.x)); hair.setAttribute("x2", X(p.x)); hair.setAttribute("visibility", "visible");
    tip.textContent = "";
    tip.append(el("div", { class: "l" }, t.kick ? "Pre-match" : `${period(t)} ${t.clock} · ${t.home}–${t.away}`));
    const lineRow = (cls, label, v) => { const d = el("div"); d.append(el("span", { class: "key " + cls }), el("span", { class: "v" }, pct(v)), el("span", { class: "l" }, " " + label)); tip.append(d); };
    lineRow("v21", "v21", p.v21);
    lineRow("prod", "Prod", p.prod);
    tip.style.display = "block";
    const wrap = $("chartWrap").getBoundingClientRect();
    tip.style.left = Math.min(evt.clientX - wrap.left + 12, wrap.width - tip.offsetWidth - 4) + "px";
    tip.style.top = "8px";
  });
  hit.addEventListener("pointerleave", () => { tip.style.display = "none"; hair.setAttribute("visibility", "hidden"); });
  hit.addEventListener("click", (evt) => { stopPlay(); go(nearest(evt)); });
}

// ---------------------------------------------------------------- whole match, nudge, play

async function priceAll() {
  if (!S.match) return;
  setStatus("Pricing all…");
  $("priceAll").disabled = true;
  try {
    const r = await api("/api/price_all", Object.assign({ code: S.match.code, chart_paths: S.meta.chart_paths }, nudgeBody()));
    S.chartV21.clear();
    for (const p of r.points) S.chartV21.set(p.message == null ? "kick" : p.message, p.home);
    setStatus("");
    refreshTimelineProbs();
    drawChart();
  } catch (e) { setStatus(e.message, true); }
  $("priceAll").disabled = false;
}

function applyNudge() {
  const h = parseFloat($("meanHome").value), a = parseFloat($("meanAway").value);
  S.means = isFinite(h) && isFinite(a) ? [h, a] : null;
  S.share = parseFloat($("share").value);
  S.paths = parseInt($("paths").value, 10) || S.meta.paths;
  S.prices.clear(); S.chartV21.clear();
  go(S.pos);
}
function resetNudge() {
  if (!S.match) return;
  const p = S.match.prior;
  $("meanHome").value = p ? p[0] : ""; $("meanAway").value = p ? p[1] : "";
  $("share").value = S.meta.share; $("shareText").textContent = Math.round(100 * S.meta.share) + "%";
  applyNudge();
}

function nextIndex(i, dir) {
  const only = $("pricedOnly").checked;
  let k = i + dir;
  while (only && k > 0 && k < S.steps.length && !S.steps[k].priced) k += dir;
  return Math.max(0, Math.min(S.steps.length - 1, k));
}
function stopPlay() { if (S.playing) { clearTimeout(S.playing); S.playing = null; $("play").textContent = "Play"; } }
async function tickPlay() {
  if (!S.playing) return;
  if (S.pos >= S.steps.length - 1) { stopPlay(); return; }
  await go(nextIndex(S.pos, 1));
  if (S.playing) S.playing = setTimeout(tickPlay, parseInt($("speed").value, 10));
}
function togglePlay() {
  if (S.playing) { stopPlay(); return; }
  $("play").textContent = "Pause";
  S.playing = setTimeout(tickPlay, 10);
}

$("day").addEventListener("change", loadDay);
$("loadMatch").addEventListener("click", loadMatch);
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") loadMatch(); });
$("match").addEventListener("change", () => { $("code").value = ""; loadMatch(); });
$("first").addEventListener("click", () => { stopPlay(); go(0); });
$("prev").addEventListener("click", () => { stopPlay(); go(nextIndex(S.pos, -1)); });
$("next").addEventListener("click", () => { stopPlay(); go(nextIndex(S.pos, 1)); });
$("last").addEventListener("click", () => { stopPlay(); go(S.steps.length - 1); });
$("play").addEventListener("click", togglePlay);
$("priceAll").addEventListener("click", priceAll);
$("applyNudge").addEventListener("click", applyNudge);
$("resetNudge").addEventListener("click", resetNudge);
$("share").addEventListener("input", () => { $("shareText").textContent = Math.round(100 * parseFloat($("share").value)) + "%"; });
document.addEventListener("keydown", (e) => {
  if (!S.match || ["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight") { e.preventDefault(); stopPlay(); go(nextIndex(S.pos, 1)); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); stopPlay(); go(nextIndex(S.pos, -1)); }
  else if (e.key === "Home") { e.preventDefault(); stopPlay(); go(0); }
  else if (e.key === "End") { e.preventDefault(); stopPlay(); go(S.steps.length - 1); }
  else if (e.key === " ") { e.preventDefault(); togglePlay(); }
});
window.addEventListener("resize", () => {
  drawChart();
  const t = S.steps[S.pos];
  const pr = t && S.prices.get(priceKey(t.kick ? "kick" : t.message));
  if (pr && pr.priced) {
    drawDist($("marginDist"), pr.margin_dist, (pr.prod["52"] || {}).line);
    drawDist($("totalDist"), pr.total_dist, (pr.prod["54"] || {}).line);
  }
});
init().catch((e) => setStatus(e.message, true));
</script>
